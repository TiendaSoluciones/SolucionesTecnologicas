<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mi perfil | Soluciones Tecnológicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .perfil {
            max-width: 750px;
            margin: 45px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .titulo {
            color: #174477;
        }

        .btn-principal {
            background-color: #1455a0;
            color: white;
        }

        .btn-principal:hover {
            background-color: #123c70;
            color: white;
        }
    </style>
</head>

<body>

    <div th:replace="~{general/fragmentos :: menu}"></div>

    <main class="container">

        <div class="perfil">

            <h2 class="titulo fw-bold mb-2">
                Mi perfil
            </h2>

            <p class="text-muted mb-4">
                Consulta y actualiza tu información personal.
            </p>

            <div class="alert alert-success"
                 th:if="${mensaje}"
                 th:text="${mensaje}">
            </div>

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <form th:action="@{/usuario/perfil/guardar}"
                  th:object="${usuario}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre completo
                    </label>

                    <input type="text"
                           th:field="*{nombreCompleto}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Correo electrónico
                    </label>

                    <input type="email"
                           th:field="*{correo}"
                           class="form-control"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input type="tel"
                           th:field="*{telefono}"
                           class="form-control">

                </div>

                <div class="d-flex justify-content-between
                            flex-wrap gap-2">

                    <a th:href="@{/}"
                       class="btn btn-outline-secondary">

                        Volver al inicio

                    </a>

                    <button type="submit"
                            class="btn btn-principal">

                        Guardar cambios

                    </button>

                </div>

            </form>

            <hr class="my-4">

            <div class="d-flex justify-content-between
                        flex-wrap gap-2">

                <a th:href="@{/reparacion/mis-reparaciones}"
                   class="btn btn-outline-primary">

                    Mis reparaciones

                </a>

                <a th:href="@{/reparacion/nueva}"
                   class="btn btn-outline-success">

                    Solicitar reparación

                </a>

            </div>

        </div>

    </main>

</body>
</html>
