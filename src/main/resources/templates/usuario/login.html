<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Iniciar sesión | Soluciones Tecnológicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .login-card {
            max-width: 480px;
            border: none;
            border-radius: 12px;
        }

        .titulo {
            color: #174477;
        }

        .btn-principal {
            background-color: #1455a0;
            color: white;
        }

        .btn-principal:hover {
            background-color: #123c70;
            color: white;
        }

        footer {
            background-color: #123c70;
            color: white;
            padding: 25px;
        }
    </style>
</head>

<body>

    <div th:replace="~{general/fragmentos :: menu}"></div>

    <main class="container d-flex justify-content-center
                 align-items-center py-5"
          style="min-height: 75vh;">

        <div class="card login-card shadow-sm w-100">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <i class="fa-solid fa-user-circle fa-4x text-primary mb-3"></i>

                    <h2 class="titulo fw-bold">
                        Iniciar sesión
                    </h2>

                    <p class="text-muted">
                        Ingresa a tu cuenta de Soluciones Tecnológicas.
                    </p>

                </div>

                <!-- Mensajes -->
                <div class="alert alert-success"
                     th:if="${mensaje}"
                     th:text="${mensaje}">
                </div>

                <div class="alert alert-danger"
                     th:if="${error}"
                     th:text="${error}">
                </div>

                <!-- Formulario -->
                <form th:action="@{/login}" method="post">

                    <div class="mb-3">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email"
                               name="correo"
                               class="form-control"
                               placeholder="correo@ejemplo.com"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               name="contrasena"
                               class="form-control"
                               placeholder="Ingresa tu contraseña"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-principal w-100 py-2">

                        <i class="fa-solid fa-right-to-bracket me-2"></i>
                        Iniciar sesión

                    </button>

                </form>

                <div class="text-center mt-4">

                    <p>
                        ¿No tienes una cuenta?
                        <a th:href="@{/registro}">
                            Regístrate aquí
                        </a>
                    </p>

                    <a th:href="@{/}" class="text-secondary">
                        Volver al inicio
                    </a>

                </div>

            </div>

        </div>

    </main>

    <footer class="text-center">

        <h5>Soluciones Tecnológicas</h5>

        <p class="mb-0">
            Tu aliado en tecnología.
        </p>

        <small>© 2026 Soluciones Tecnológicas.</small>

    </footer>

</body>
</html>
