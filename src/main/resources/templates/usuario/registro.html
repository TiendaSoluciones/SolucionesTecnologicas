<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registro | Soluciones Tecnológicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .formulario {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .titulo {
            color: #174477;
        }

        .btn-principal {
            background-color: #1455a0;
            color: white;
        }

        .btn-principal:hover {
            background-color: #123c70;
            color: white;
        }
    </style>
</head>

<body>

    <div th:replace="~{general/fragmentos :: menu}"></div>

    <main class="container">

        <div class="formulario">

            <h2 class="titulo fw-bold text-center mb-2">
                Crear una cuenta
            </h2>

            <p class="text-muted text-center mb-4">
                Regístrate para acceder a nuestros servicios.
            </p>

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <form th:action="@{/usuario/guardar}"
                  th:object="${usuario}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre completo
                    </label>

                    <input type="text"
                           th:field="*{nombreCompleto}"
                           class="form-control"
                           placeholder="Nombre y apellidos"
                           maxlength="100"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Correo electrónico
                    </label>

                    <input type="email"
                           th:field="*{correo}"
                           class="form-control"
                           placeholder="correo@ejemplo.com"
                           maxlength="100"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input type="tel"
                           th:field="*{telefono}"
                           class="form-control"
                           placeholder="8888-8888"
                           maxlength="20">

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           th:field="*{contrasena}"
                           class="form-control"
                           placeholder="Crea una contraseña"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-principal w-100">

                    Crear cuenta

                </button>

            </form>

            <div class="text-center mt-4">

                <p>
                    ¿Ya tienes una cuenta?
                    <a th:href="@{/login}">
                        Inicia sesión
                    </a>
                </p>

            </div>

        </div>

    </main>

</body>
</html>
