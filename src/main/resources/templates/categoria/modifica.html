<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar categoría | Soluciones Tecnológicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
        }

        .navbar-brand {
            color: #174477;
            font-weight: bold;
        }

        .encabezado {
            background-color: #174477;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .contenido {
            max-width: 850px;
            margin: 45px auto;
        }

        .formulario {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .btn-principal {
            background-color: #0d6efd;
            color: white;
        }

        .btn-principal:hover {
            background-color: #0b5ed7;
            color: white;
        }

        footer {
            background-color: #174477;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            Soluciones Tecnológicas
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Inicio</a>
            <a class="nav-link" th:href="@{/producto/listado}">Productos</a>
            <a class="nav-link active" th:href="@{/categoria/listado}">Categorías</a>
        </div>
    </div>
</nav>

<header class="encabezado">
    <h1 class="fw-bold">Administrar categoría</h1>
    <p class="mb-0">Registra o actualiza una categoría de productos.</p>
</header>

<main class="container contenido">

    <div class="formulario">

        <h3 class="fw-bold mb-4" style="color:#174477;"
            th:text="${categoria.id == null ? 'Nueva categoría' : 'Modificar categoría'}">
            Nueva categoría
        </h3>

        <form th:action="@{/categoria/guardar}"
              th:object="${categoria}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label for="nombre" class="form-label fw-semibold">
                    Nombre de la categoría
                </label>

                <input type="text"
                       class="form-control"
                       id="nombre"
                       th:field="*{nombre}"
                       placeholder="Ej. Computadoras"
                       maxlength="100"
                       required>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label fw-semibold">
                    Descripción
                </label>

                <textarea class="form-control"
                          id="descripcion"
                          th:field="*{descripcion}"
                          rows="4"
                          placeholder="Describe brevemente esta categoría..."
                          maxlength="255"></textarea>
            </div>

            <div class="d-flex justify-content-between flex-wrap gap-2">
                <a th:href="@{/categoria/listado}"
                   class="btn btn-outline-secondary px-4">
                    Cancelar
                </a>

                <button type="submit" class="btn btn-principal px-4">
                    Guardar categoría
                </button>
            </div>

        </form>

    </div>

</main>

<footer>
    <h5>Soluciones Tecnológicas</h5>
    <p class="mb-0">Tu aliado en tecnología.</p>
    <small>© 2026 Soluciones Tecnológicas. Todos los derechos reservados.</small>
</footer>

</body>
</html>
