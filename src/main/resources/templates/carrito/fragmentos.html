<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mi carrito</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>

    <body>

        <section th:fragment="listado" class="container py-5">

            <h2 class="mb-4">
                <i class="fas fa-shopping-cart"></i>
                Mi carrito de compras
            </h2>

            <div class="row">

                <!-- productos del carrito -->
                <div class="col-md-8">

                    <div class="card shadow-sm mb-4">

                        <div class="card-body">

                            <div th:if="${#lists.isEmpty(detalles)}"
                                 class="text-center py-5">

                                <i class="fas fa-shopping-basket fa-3x text-secondary mb-3"></i>

                                <h4>Tu carrito está vacío</h4>

                                <p class="text-muted">
                                    Todavía no has agregado productos.
                                </p>

                                <a th:href="@{/}"
                                   class="btn btn-primary">
                                    Seguir comprando
                                </a>

                            </div>

                            <div th:unless="${#lists.isEmpty(detalles)}">

                                <div class="table-responsive">

                                    <table class="table align-middle">

                                        <thead>
                                            <tr>
                                                <th>Producto</th>
                                                <th>Precio</th>
                                                <th>Cantidad</th>
                                                <th>Subtotal</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>

                                        <tbody>

                                            <tr th:each="item : ${detalles}">

                                                <td>
                                                    <img th:if="${item.producto.imagen != null}"
                                                         th:src="${item.producto.imagen}"
                                                         th:alt="${item.producto.nombre}"
                                                         width="65"
                                                         height="65"
                                                         style="object-fit: contain;">

                                                    <span class="ms-2"
                                                          th:text="${item.producto.nombre}">
                                                    </span>
                                                </td>

                                                <td>
                                                    ₡<span th:text="${#numbers.formatDecimal(item.producto.precio, 1, 'COMMA', 2, 'POINT')}"></span>
                                                </td>

                                                <td>

                                                    <form th:action="@{/carrito/actualizar}"
                                                          method="post"
                                                          class="d-flex gap-2">
                                                        
                                                        <input type="hidden"
                                                               name="idProducto"
                                                               th:value="${item.producto.id}">

                                                        <input type="number"
                                                               name="cantidad"
                                                               th:value="${item.cantidad}"
                                                               min="1"
                                                               class="form-control"
                                                               style="width: 75px;">

                                                        <button type="submit"
                                                                class="btn btn-outline-primary btn-sm">
                                                            <i class="fas fa-sync-alt"></i>
                                                        </button>

                                                    </form>

                                                </td>

                                                <td>
                                                    ₡<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"></span>
                                                </td>

                                                <td>

                                                    <form th:action="@{/carrito/eliminar}"
                                                          method="post">

                                                        <input type="hidden"
                                                               name="idProducto"
                                                               th:value="${item.producto.id}">

                                                        <button type="submit"
                                                                class="btn btn-danger btn-sm">
                                                            <i class="fas fa-trash"></i>
                                                        </button>

                                                    </form>

                                                </td>

                                            </tr>

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- resumen de compra -->
                <div class="col-md-4">

                    <div class="card shadow-sm">

                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Resumen de compra</h5>
                        </div>

                        <div class="card-body">

                            <p class="d-flex justify-content-between">
                                <span>Productos:</span>
                                <strong th:text="${cantidadProductos}"></strong>
                            </p>

                            <hr>

                            <div class="d-flex justify-content-between mb-3">
                                <h5>Total:</h5>

                                <h5 class="text-primary">
                                    ₡<span th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></span>
                                </h5>
                            </div>

                            <button type="button"
                                    class="btn btn-success w-100"
                                    th:disabled="${#lists.isEmpty(detalles)}">
                                <i class="fas fa-check-circle"></i>
                                Finalizar compra
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </body>
</html>
