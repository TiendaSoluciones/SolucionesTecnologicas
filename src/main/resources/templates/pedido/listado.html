<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mis pedidos - Soluciones Tecnológicas</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/producto/listado}">
                    Soluciones Tecnológicas
                </a>

                <a class="btn btn-outline-light" th:href="@{/carrito/listado}">
                    Volver al carrito
                </a>
            </div>
        </nav>

        <main class="container py-5">

            <h2 class="mb-4">Mis pedidos</h2>

            <div class="alert alert-success" th:if="${mensaje}"
                 th:text="${mensaje}">
            </div>

            <div class="alert alert-info" th:if="${#lists.isEmpty(pedidos)}">
                Todavía no hay pedidos registrados.
            </div>

            <div class="card shadow-sm" th:unless="${#lists.isEmpty(pedidos)}">

                <div class="card-body">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead class="table-dark">
                                <tr>
                                    <th>Número de pedido</th>
                                    <th>Fecha</th>
                                    <th>Cliente</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="pedido : ${pedidos}">

                                    <td th:text="${pedido.id}"></td>

                                    <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></td>

                                    <td th:text="${pedido.cliente.nombreCompleto}"></td>

                                    <td th:text="${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT') + ' colones'}"></td>

                                    <td>
                                        <span class="badge bg-warning text-dark"
                                              th:text="${pedido.estado}">
                                        </span>
                                    </td>

                                    <td>
                                        <a class="btn btn-primary btn-sm"
                                           th:href="@{/pedido/detalle/{id}(id=${pedido.id})}">
                                            Ver detalle
                                        </a>
                                    </td>

                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>
            </div>

            <div class="mt-4">
                <a class="btn btn-secondary" th:href="@{/producto/listado}">
                    Seguir comprando
                </a>
            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
