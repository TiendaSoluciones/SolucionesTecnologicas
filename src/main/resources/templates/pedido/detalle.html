<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Detalle del pedido - Soluciones Tecnológicas</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/producto/listado}">
                    Soluciones Tecnológicas
                </a>

                <a class="btn btn-outline-light" th:href="@{/pedido/listado}">
                    Volver a mis pedidos
                </a>
            </div>
        </nav>

        <main class="container py-5">

            <h2 class="mb-4">Detalle del pedido</h2>

            <div class="card shadow-sm mb-4">
                <div class="card-body">

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <strong>Número de pedido:</strong>
                            <p th:text="${pedido.id}"></p>
                        </div>

                        <div class="col-md-4 mb-3">
                            <strong>Fecha:</strong>
                            <p th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></p>
                        </div>

                        <div class="col-md-4 mb-3">
                            <strong>Estado:</strong>
                            <p>
                                <span class="badge bg-warning text-dark"
                                      th:text="${pedido.estado}">
                                </span>
                            </p>
                        </div>
                    </div>

                    <hr>

                    <strong>Cliente:</strong>
                    <p th:text="${pedido.cliente.nombreCompleto}"></p>

                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="mb-3">Productos del pedido</h5>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead class="table-dark">
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio unitario</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="detalle : ${detalles}">

                                    <td th:text="${detalle.producto.nombre}"></td>

                                    <td th:text="${#numbers.formatDecimal(detalle.precioUnitario, 1, 'COMMA', 2, 'POINT') + ' colones'}"></td>

                                    <td th:text="${detalle.cantidad}"></td>

                                    <td th:text="${#numbers.formatDecimal(detalle.precioUnitario * detalle.cantidad, 1, 'COMMA', 2, 'POINT') + ' colones'}"></td>

                                </tr>
                            </tbody>

                        </table>
                    </div>

                    <div class="text-end mt-4">
                        <h4>
                            Total:
                            <span th:text="${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT') + ' colones'}"></span>
                        </h4>
                    </div>

                </div>
            </div>

            <div class="mt-4">
                <a class="btn btn-secondary" th:href="@{/pedido/listado}">
                    Volver a mis pedidos
                </a>
            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
